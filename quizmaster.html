
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizMaster - GK Quiz</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: url("rainbow-landscape.png") center / cover fixed no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #3c2415;
        }

        .card {
            width: 100%;
            max-width: 680px;
            background: #fff3d7;
            border: 5px solid #8a4c20;
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 12px 28px rgba(0,0,0,0.28);
        }

        h1 {
            color: #713813;
            font-size: 2.4rem;
            margin-bottom: 8px;
        }

        .tagline {
            color: #80532f;
            margin-bottom: 24px;
        }

        .info {
            display: flex;
            justify-content: space-between;
            margin: 20px 0;
            font-weight: bold;
        }

        #question {
            font-size: 1.35rem;
            margin: 26px 0;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .option {
            padding: 14px;
            border: 2px solid #b87936;
            border-radius: 12px;
            background: #ffe0a5;
            color: #4b2b17;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .option:hover {
            background: #ffd17b;
        }

        .option.selected {
            background: #f4c45f;
            border-color: #754018;
        }

        .main-button {
            margin-top: 22px;
            padding: 14px 25px;
            border: 2px solid #34751d;
            border-radius: 12px;
            background: #65b52e;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .main-button:hover {
            background: #4d9822;
        }

        .main-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .hidden {
            display: none;
        }

        #feedback {
            min-height: 24px;
            font-weight: bold;
            margin-top: 15px;
        }

        @media (max-width: 520px) {
            .card {
                padding: 22px 16px;
            }

            .options {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>

    <main class="card">

        <!-- Welcome Screen -->
        <section id="welcome">
            <h1>QuizMaster</h1>
            <p class="tagline">
                A Little Curiosity Goes a Long Way!
            </p>

            <p>
                Test your General Knowledge with 10 questions
                selected randomly from our question bank of 75.
            </p>

            <p>Choose your answers and check your final score!</p>

            <button class="main-button" onclick="startQuiz()">
                Start Quiz
            </button>
        </section>


        <!-- Quiz Screen -->
        <section id="quiz" class="hidden">

            <div class="info">
                <span id="questionNumber">Question 1 of 10</span>
                <span id="score">Score: 0</span>
            </div>

            <h2 id="question"></h2>

            <div id="options" class="options"></div>

            <p id="feedback"></p>

            <button id="nextButton"
                    class="main-button"
                    onclick="nextQuestion()"
                    disabled>
                Next Question
            </button>

        </section>


        <!-- Result Screen -->
        <section id="result" class="hidden">

            <h1>Quiz Completed!</h1>

            <h2 id="finalScore"></h2>

            <p id="resultMessage"></p>

            <button class="main-button" onclick="startQuiz()">
                Play Again
            </button>

        </section>

    </main>

        ];


        // Variables used in the quiz

        let quizQuestions = [];
        let currentQuestion = 0;
        let totalScore = 0;
        let selectedAnswer = "";


        // Start the quiz

        function startQuiz() {

            // Shuffle questions and select 10 randomly

            quizQuestions = questionBank
                .slice()
                .sort(() => Math.random() - 0.5)
                .slice(0, 10);

            currentQuestion = 0;
            totalScore = 0;

            document.getElementById("welcome").classList.add("hidden");
            document.getElementById("result").classList.add("hidden");
            document.getElementById("quiz").classList.remove("hidden");

            showQuestion();
        }


        // Display the current question

        function showQuestion() {

            selectedAnswer = "";

            const question = quizQuestions[currentQuestion];

            document.getElementById("questionNumber").textContent =
                "Question " + (currentQuestion + 1) + " of 10";

            document.getElementById("score").textContent =
                "Score: " + totalScore;

            document.getElementById("question").textContent =
                question.q;

            document.getElementById("feedback").textContent = "";

            document.getElementById("nextButton").disabled = true;

            const optionsArea = document.getElementById("options");

            optionsArea.innerHTML = "";

            question.o.forEach(function(option) {

                const button = document.createElement("button");

                button.textContent = option;
                button.className = "option";

                button.addEventListener("click", function() {
                    selectAnswer(option, button);
                });

                optionsArea.appendChild(button);

            });

            document.getElementById("nextButton").textContent =
                currentQuestion === 9 ? "See Result" : "Next Question";
        }


        // Select an answer

        function selectAnswer(answer, clickedButton) {

            selectedAnswer = answer;

            const allOptions = document.querySelectorAll(".option");

            allOptions.forEach(function(button) {
                button.classList.remove("selected");
            });

            clickedButton.classList.add("selected");

            document.getElementById("nextButton").disabled = false;
        }


        // Move to the next question

        function nextQuestion() {

            const correctAnswer = quizQuestions[currentQuestion].a;

            if (selectedAnswer === correctAnswer) {
                totalScore++;
            }

            if (currentQuestion < 9) {

                currentQuestion++;

                showQuestion();

            } else {

                showResult();

            }
        }


        // Display the final result

        function showResult() {

            document.getElementById("quiz").classList.add("hidden");

            document.getElementById("result").classList.remove("hidden");

            document.getElementById("finalScore").textContent =
                "Your Score: " + totalScore + " / 10";

            if (totalScore >= 8) {

                document.getElementById("resultMessage").textContent =
                    "Excellent work! You know your GK!";

            } else if (totalScore >= 5) {

                document.getElementById("resultMessage").textContent =
                    "Good effort! Keep learning and try again.";

            } else {

                document.getElementById("resultMessage").textContent =
                    "Nice try! A new round is waiting for you.";

            }
        }
